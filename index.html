<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SORU TEKRARI</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1e293b" />
  
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: white;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface-light); color: var(--text); }
    .btn-secondary:hover { background: #475569; }
    .btn-accent { background: var(--accent); color: white; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
    }

    /* Filtre Çubuğu */
    .filter-panel {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    select, input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }

    /* Soru Listesi Izgarası */
    .questions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }

    .badge-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .badge-exam { background: #3b82f633; color: #60a5fa; border: 1px solid #3b82f64d; }
    .badge-subject { background: #10b98133; color: #34d399; border: 1px solid #10b9814d; }

    .card-topic {
      padding: 8px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-body {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .img-box {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 380px;
      cursor: zoom-in;
    }

    .img-box img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .solution-box {
      display: none;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }

    .card-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
    }

    .card-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    /* Modal / Form */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h2 { font-size: 1.15rem; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .file-input-wrapper {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .file-input-wrapper input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .preview-thumbnail {
      max-height: 80px;
      border-radius: 4px;
      margin-top: 6px;
      display: none;
      object-fit: contain;
    }

    /* Boş Durum */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* A4 Baskı / PDF Şablonu */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        padding-bottom: 0 !important;
      }
      header, .filter-panel, .card-footer, .modal-overlay, .btn {
        display: none !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
      }
      .questions-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 15px !important;
      }
      .card {
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        background: #fff !important;
      }
      .badge-exam, .badge-subject {
        border: 1px solid #888 !important;
        color: #000 !important;
      }
      .img-box {
        background: #fff !important;
        max-height: 280px !important;
      }
      .solution-box {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">ST</div>
      <h1>SORU TEKRARI</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="exportData()" title="Yedeği İndir">Yedekle</button>
      <input type="file" id="importInput" style="display:none" onchange="importData(event)" accept=".json" />
      <button class="btn btn-secondary" onclick="document.getElementById('importInput').click()" title="Yedekten Yükle">Geri Yükle</button>
      <button class="btn btn-accent" onclick="window.print()" title="Filtrelenenleri Yazdır/PDF Yap">PDF Al</button>
      <button class="btn btn-primary" onclick="openModal()">+ Soru Ekle</button>
    </div>
  </header>

  <main>
    <div class="filter-panel">
      <select id="filterExam" onchange="applyFilters()">
        <option value="">Tüm Sınavlar</option>
      </select>
      <select id="filterSubject" onchange="applyFilters()">
        <option value="">Tüm Dersler</option>
      </select>
      <input type="text" id="searchTopic" placeholder="Konu ara..." oninput="applyFilters()" />
    </div>

    <div id="questionsContainer" class="questions-grid"></div>
    <div id="emptyState" class="empty-state" style="display: none;">
      Henüz kaydedilmiş soru yok veya filtreye uygun soru bulunamadı.
    </div>
  </main>

  <!-- Soru Ekleme Modalı -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Yeni Soru Kaydet</h2>
      
      <div class="form-group">
        <label>Sınav Türü</label>
        <select id="formExam">
          <option value="YKS-TYT">YKS - TYT</option>
          <option value="YKS-AYT">YKS - AYT</option>
          <option value="LGS">LGS</option>
          <option value="KPSS">KPSS</option>
          <option value="DGS">DGS</option>
          <option value="ALES">ALES</option>
          <option value="TUS">TUS</option>
          <option value="DUS">DUS</option>
          <option value="AGS">AGS</option>
          <option value="ÖABT">ÖABT</option>
          <option value="DİĞER">Diğer</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ders</label>
        <input type="text" id="formSubject" placeholder="Örn: Matematik, Biyoloji, Türkçe..." required />
      </div>

      <div class="form-group">
        <label>Konu</label>
        <input type="text" id="formTopic" placeholder="Örn: Türev, Hücre Bölünmesi, Paragraf..." required />
      </div>

      <div class="form-group">
        <label>Soru Görseli (Zorunlu)</label>
        <div class="file-input-wrapper">
          <span>Fotoğraf Çek veya Galeriden Seç</span>
          <input type="file" id="formQuestionImg" accept="image/*" onchange="previewImage(event, 'previewQ')" />
          <img id="previewQ" class="preview-thumbnail" />
        </div>
      </div>

      <div class="form-group">
        <label>Çözüm Görseli (İsteğe Bağlı)</label>
        <div class="file-input-wrapper">
          <span>Çözümün Fotoğrafını Ekle (Opsiyonel)</span>
          <input type="file" id="formSolutionImg" accept="image/*" onchange="previewImage(event, 'previewS')" />
          <img id="previewS" class="preview-thumbnail" />
        </div>
      </div>

      <div class="form-group">
        <label>Hatırlatıcı Not / İpucu (İsteğe Bağlı)</label>
        <input type="text" id="formNote" placeholder="Örn: Ters köşe formülüne dikkat!" />
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button class="btn btn-secondary" onclick="closeModal()">Vazgeç</button>
        <button class="btn btn-primary" onclick="saveQuestion()">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    // --- IndexedDB Veritabanı Katmanı ---
    const DB_NAME = "SoruTekrariDB";
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains("questions")) {
            const store = dbInstance.createObjectStore("questions", { keyPath: "id", autoIncrement: true });
            store.createIndex("timestamp", "timestamp", { unique: false });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = () => reject("Veritabanı açılamadı!");
      });
    }

    // --- Görsel Sıkıştırma (Canvas) ---
    function compressImage(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (readerEvent) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = readerEvent.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    let allQuestions = [];

    async function loadQuestions() {
      const tx = db.transaction("questions", "readonly");
      const store = tx.objectStore("questions");
      const req = store.getAll();
      req.onsuccess = () => {
        // Kronolojik sıralama: En son eklenen en üstte
        allQuestions = req.result.sort((a, b) => b.timestamp - a.timestamp);
        populateFilterOptions();
        renderQuestions(allQuestions);
      };
    }

    function populateFilterOptions() {
      const examSelect = document.getElementById("filterExam");
      const subjectSelect = document.getElementById("filterSubject");

      const exams = [...new Set(allQuestions.map(q => q.exam))].filter(Boolean);
      const subjects = [...new Set(allQuestions.map(q => q.subject))].filter(Boolean);

      examSelect.innerHTML = '<option value="">Tüm Sınavlar</option>' + exams.map(e => `<option value="${e}">${e}</option>`).join("");
      subjectSelect.innerHTML = '<option value="">Tüm Dersler</option>' + subjects.map(s => `<option value="${s}">${s}</option>`).join("");
    }

    function renderQuestions(list) {
      const container = document.getElementById("questionsContainer");
      const empty = document.getElementById("emptyState");

      if (list.length === 0) {
        container.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      container.innerHTML = list.map(q => `
        <div class="card" id="card-${q.id}">
          <div class="card-header">
            <div class="badge-group">
              <span class="badge badge-exam">${q.exam}</span>
              <span class="badge badge-subject">${q.subject}</span>
            </div>
            <span style="color:var(--text-muted)">${new Date(q.timestamp).toLocaleDateString("tr-TR")}</span>
          </div>

          <div class="card-topic">${q.topic}</div>

          <div class="card-body">
            <div class="img-box" onclick="toggleZoom(this)">
              <img src="${q.questionImg}" alt="Soru" loading="lazy" />
            </div>

            ${q.solutionImg ? `
              <div class="solution-box" id="sol-${q.id}">
                <div class="img-box" onclick="toggleZoom(this)">
                  <img src="${q.solutionImg}" alt="Çözüm" loading="lazy" />
                </div>
              </div>
            ` : ""}

            ${q.note ? `<div class="card-note">📌 ${q.note}</div>` : ""}
          </div>

          <div class="card-footer">
            ${q.solutionImg ? `
              <button class="btn btn-secondary" onclick="toggleSolution(${q.id})">Çözüm Göster/Gizle</button>
            ` : "<span></span>"}
            <button class="btn btn-danger" onclick="deleteQuestion(${q.id})">Sil</button>
          </div>
        </div>
      `).join("");
    }

    function toggleSolution(id) {
      const sol = document.getElementById(`sol-${id}`);
      if (sol) {
        sol.style.display = sol.style.display === "block" ? "none" : "block";
      }
    }

    function toggleZoom(box) {
      if (box.style.maxHeight === "none") {
        box.style.maxHeight = "380px";
      } else {
        box.style.maxHeight = "none";
      }
    }

    function applyFilters() {
      const examVal = document.getElementById("filterExam").value;
      const subVal = document.getElementById("filterSubject").value;
      const searchVal = document.getElementById("searchTopic").value.toLowerCase();

      const filtered = allQuestions.filter(q => {
        const matchesExam = !examVal || q.exam === examVal;
        const matchesSub = !subVal || q.subject === subVal;
        const matchesTopic = !searchVal || q.topic.toLowerCase().includes(searchVal);
        return matchesExam && matchesSub && matchesTopic;
      });

      renderQuestions(filtered);
    }

    async function saveQuestion() {
      const exam = document.getElementById("formExam").value;
      const subject = document.getElementById("formSubject").value.trim();
      const topic = document.getElementById("formTopic").value.trim();
      const note = document.getElementById("formNote").value.trim();
      const qFile = document.getElementById("formQuestionImg").files[0];
      const sFile = document.getElementById("formSolutionImg").files[0];

      if (!subject || !topic || !qFile) {
        alert("Lütfen ders, konu ve soru görselini eksiksiz girin.");
        return;
      }

      const questionImg = await compressImage(qFile);
      const solutionImg = sFile ? await compressImage(sFile) : null;

      const newRecord = {
        exam,
        subject,
        topic,
        note,
        questionImg,
        solutionImg,
        timestamp: Date.now()
      };

      const tx = db.transaction("questions", "readwrite");
      tx.objectStore("questions").add(newRecord);
      tx.oncomplete = () => {
        closeModal();
        loadQuestions();
      };
    }

    function deleteQuestion(id) {
      if (!confirm("Bu soruyu arşivden silmek istediğinize emin misiniz?")) return;
      const tx = db.transaction("questions", "readwrite");
      tx.objectStore("questions").delete(id);
      tx.oncomplete = () => loadQuestions();
    }

    // Modal Yönetimi
    function openModal() {
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
      document.getElementById("formSubject").value = "";
      document.getElementById("formTopic").value = "";
      document.getElementById("formNote").value = "";
      document.getElementById("formQuestionImg").value = "";
      document.getElementById("formSolutionImg").value = "";
      document.getElementById("previewQ").style.display = "none";
      document.getElementById("previewS").style.display = "none";
    }

    function previewImage(e, previewId) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = document.getElementById(previewId);
          img.src = ev.target.result;
          img.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    // Yedekleme (Dışa / İçe Aktar)
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allQuestions));
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `soru_tekrari_yedek_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchor.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            const tx = db.transaction("questions", "readwrite");
            const store = tx.objectStore("questions");
            imported.forEach(item => {
              delete item.id; // Yeni ID ile yazılsın
              store.add(item);
            });
            tx.oncomplete = () => {
              alert("Yedek başarıyla yüklendi!");
              loadQuestions();
            };
          }
        } catch (err) {
          alert("Geçersiz yedek dosyası!");
        }
      };
      reader.readAsText(file);
    }

    // Başlat
    window.addEventListener("DOMContentLoaded", () => {
      initDB().then(() => loadQuestions());
    });
  </script>
</body>
</html>
