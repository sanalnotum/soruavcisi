<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SORU TEKRARI | Akıllı Soru Arşivi & Çözüm Tahtası</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #06b6d4;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
    }

    html.light {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    /* GitHub'a yükleyeceğiniz logo için img alanı (Örn: logo.png) */
    .app-logo { height: 40px; width: auto; object-fit: contain; border-radius: 6px; background: rgba(255,255,255,0.05); }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-size: 1.15rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
    .creator-tag { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .nav-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn {
      padding: 0.5rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.85; filter: brightness(1.1); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-sm { padding: 0.35rem 0.6rem; font-size: 0.75rem; }

    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

    /* İstatistik Paneli */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow);
    }
    .stat-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }

    /* Filtre Barı */
    .filter-bar {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }
    .filter-bar select, .filter-bar input {
      flex: 1;
      min-width: 140px;
      padding: 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text);
    }

    /* Soru Listesi Kartları */
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }
    .q-card {
      background: var(--card-bg);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .q-header {
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.15);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    html.light .q-header { background: #f1f5f9; }

    .badge {
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
    }
    .badge-bilgi { background: var(--danger); }
    .badge-dikkat { background: var(--warning); color: #000; }
    .badge-sure { background: var(--info); color: #000; }
    .badge-yorum { background: #8b5cf6; }

    .q-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .q-image-wrap {
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      position: relative;
    }
    .q-image-wrap img { max-width: 100%; max-height: 280px; object-fit: contain; }
    .solution-box {
      border: 1px dashed var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      display: none;
      background: rgba(255,255,255,0.02);
    }
    .solution-box.active { display: block; }
    .q-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    /* Modaller */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 10px;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    .form-group select, .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.55rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
    }

    /* Karalama Tuvali Modalı */
    .canvas-modal {
      position: fixed;
      inset: 0;
      background: #090d16;
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .canvas-modal.active { display: flex; }
    .canvas-toolbar {
      padding: 10px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .canvas-workspace { flex: 1; position: relative; overflow: hidden; touch-action: none; }
    #drawCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }

    /* Çıktı / Yazdırma Modu Stilleri */
    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      header, .stats-grid, .filter-bar, .nav-actions, .q-footer, .canvas-modal, .modal-backdrop { display: none !important; }
      .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .question-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 15px !important; }
      .q-card { border: 1px solid #999 !important; background: #fff !important; box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; margin-bottom: 15px; }
      .q-header { background: #eee !important; color: #000 !important; }
      .q-image-wrap { background: none !important; }
      .solution-box { border: 1px solid #ccc !important; background: #fff !important; }
      .print-hidden { display: none !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo-area">
      <!-- GitHub'a yükleyeceğiniz logoya göre dosya adını (örn: logo.png) güncelleyebilirsiniz -->
      <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
      <div class="logo-text">
        <span class="logo-title">SORU TEKRARI</span>
        <span class="creator-tag">Hazırlayan: Yıldıray Hoca</span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary" onclick="openAddModal()">+ Soru Ekle</button>
      <button class="btn" onclick="startRandomQuiz()">🎲 Rastgele 5 Soru</button>
      <button class="btn" onclick="openPrintModal()">🖨️ PDF / Baskı Al</button>
      <button class="btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Aydınlık Mod</button>
      <button class="btn" onclick="exportData()">💾 Yedek</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📥 Yükle</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</header>

<div class="container">
  <!-- Canlı İstatistik Paneli -->
  <div class="stats-grid">
    <div class="stat-card" style="border-left-color: var(--primary);">
      <div class="stat-title">Toplam Arşiv</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card" style="border-left-color: var(--danger);">
      <div class="stat-title">Bilgi Eksikliği</div>
      <div class="stat-value" id="stat-bilgi">0</div>
    </div>
    <div class="stat-card" style="border-left-color: var(--warning);">
      <div class="stat-title">Dikkat Hatası</div>
      <div class="stat-value" id="stat-dikkat">0</div>
    </div>
    <div class="stat-card" style="border-left-color: var(--info);">
      <div class="stat-title">Süre Problemi</div>
      <div class="stat-value" id="stat-sure">0</div>
    </div>
    <div class="stat-card" style="border-left-color: #8b5cf6;">
      <div class="stat-title">Yeni Nesil / Yorum</div>
      <div class="stat-value" id="stat-yorum">0</div>
    </div>
  </div>

  <!-- Bağımsız Filtre Barı -->
  <div class="filter-bar">
    <select id="filterExam" onchange="populateFilterSubjects(); applyFilters();">
      <option value="">Tüm Sınavlar</option>
    </select>
    <select id="filterSubject" onchange="applyFilters();">
      <option value="">Tüm Dersler</option>
    </select>
    <select id="filterReason" onchange="applyFilters();">
      <option value="">Tüm Hata Tipleri</option>
      <option value="Bilgi Eksikliği">Bilgi Eksikliği</option>
      <option value="Dikkat/İşlem Hatası">Dikkat/İşlem Hatası</option>
      <option value="Süre/Yetiştirememe">Süre/Yetiştirememe</option>
      <option value="Yeni Nesil/Yorum">Yeni Nesil/Yorum</option>
    </select>
    <input type="text" id="filterText" placeholder="Konu, kaynak veya not ara..." oninput="applyFilters()">
  </div>

  <!-- Soru Listesi -->
  <div class="question-grid" id="questionList"></div>
</div>

<!-- Soru Ekleme Modalı -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h3 style="margin-bottom:1rem;">Yeni Soru Ekle</h3>
    <form id="addQuestionForm" onsubmit="saveQuestion(event)">
      <div class="form-group">
        <label>Sınav</label>
        <select id="formExam" required onchange="populateFormSubjects()"></select>
      </div>
      <div class="form-group">
        <label>Ders</label>
        <select id="formSubject" required onchange="populateFormTopics()"></select>
      </div>
      <div class="form-group">
        <label>Konu (Listeden seçin ya da listede yoksa elle yazın)</label>
        <input type="text" id="formTopic" list="topicList" required placeholder="Konu seçin veya klavyeden yazın">
        <datalist id="topicList"></datalist>
      </div>
      <div class="form-group">
        <label>Hata Nedeni</label>
        <select id="formReason" required>
          <option value="Bilgi Eksikliği">Bilgi Eksikliği</option>
          <option value="Dikkat/İşlem Hatası">Dikkat/İşlem Hatası</option>
          <option value="Süre/Yetiştirememe">Süre/Yetiştirememe</option>
          <option value="Yeni Nesil/Yorum">Yeni Nesil/Yorum</option>
        </select>
      </div>
      <div class="form-group">
        <label>Soru Görseli (Zorunlu)</label>
        <input type="file" id="inputQuestionImg" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Çözüm Görseli (İsteğe Bağlı)</label>
        <input type="file" id="inputSolutionImg" accept="image/*">
      </div>
      <div class="form-group">
        <label>Kaynak / Not</label>
        <textarea id="formNotes" rows="2" placeholder="Örn: 3D Yayınları Deneme 4"></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:1rem;">
        <button type="button" class="btn" onclick="closeAddModal()">İptal</button>
        <button type="submit" class="btn btn-primary">Arşive Kaydet</button>
      </div>
    </form>
  </div>
</div>

<!-- Baskı / PDF Mod Seçenekleri Modalı -->
<div class="modal-backdrop" id="printModal">
  <div class="modal" style="max-width: 400px; text-align: center;">
    <h3 style="margin-bottom: 1rem;">🖨️ PDF / Baskı Formatı Seçin</h3>
    <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom: 1.5rem;">Yazdırmak istediğiniz içerik düzenini belirleyin:</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn btn-primary" onclick="executePrint('questions-only')">Sadece Sorular</button>
      <button class="btn btn-primary" onclick="executePrint('solutions-only')">Sadece Çözümler</button>
      <button class="btn btn-primary" onclick="executePrint('both')">Soru + Çözüm (Alt Alta)</button>
      <button class="btn" onclick="closePrintModal()" style="margin-top: 10px;">Vazgeç</button>
    </div>
  </div>
</div>

<!-- Tam Ekran Karalama Tuvali Modalı -->
<div class="canvas-modal" id="canvasModal">
  <div class="canvas-toolbar">
    <button class="btn btn-sm" onclick="closeBoard()">Kapat (X)</button>
    <label style="font-size:0.8rem;">Renk: <input type="color" id="penColor" value="#ef4444"></label>
    <label style="font-size:0.8rem;">Kalınlık: <input type="range" id="penSize" min="1" max="10" value="3"></label>
    <button class="btn btn-sm" onclick="clearCanvas()">Temizle</button>
    <span style="font-size:0.75rem; color:var(--text-muted); margin-left:auto;">Apple Pencil / Dokunmatik Destekli</span>
  </div>
  <div class="canvas-workspace" id="canvasContainer">
    <canvas id="drawCanvas"></canvas>
  </div>
</div>

/* ==========================================================================

   ========================================================================== */
const DB_NAME = "SoruTekrariDB_YildirayHoca";
const DB_VERSION = 1;
const STORE_NAME = "questions";
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
    request.onerror = (e) => reject(e.target.errorCode);
  });
}

function dbPut(item) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE_NAME], "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function compressImage(file, maxWidth = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

/* ==========================================================================
   TEMA YÖNETİMİ
   ========================================================================== */
function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById("themeToggleBtn");
  if (html.classList.contains("dark")) {
    html.classList.remove("dark");
    btn.innerText = "🌙 Siyah Tema";
  } else {
    html.classList.add("dark");
    btn.innerText = "☀️ Aydınlık";
  }
}

/* ==========================================================================
   ARAYÜZ KONTROLLERİ & HİYERARŞİ
   ========================================================================== */
let allQuestionsCache = [];

function initDropdowns() {
  const filterExam = document.getElementById("filterExam");
  const formExam = document.getElementById("formExam");
  
  filterExam.innerHTML = '<option value="">Tüm Sınavlar</option>';
  formExam.innerHTML = '<option value="">Sınav Seçin</option>';

  Object.keys(CURRICULUM_DATA).forEach(exam => {
    filterExam.innerHTML += `<option value="${exam}">${exam}</option>`;
    formExam.innerHTML += `<option value="${exam}">${exam}</option>`;
  });
}

function populateFilterSubjects() {
  const exam = document.getElementById("filterExam").value;
  const subSelect = document.getElementById("filterSubject");
  subSelect.innerHTML = '<option value="">Tüm Dersler</option>';
  if (exam && CURRICULUM_DATA[exam]) {
    Object.keys(CURRICULUM_DATA[exam]).forEach(sub => {
      subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
    });
  }
}

function populateFormSubjects() {
  const exam = document.getElementById("formExam").value;
  const subSelect = document.getElementById("formSubject");
  subSelect.innerHTML = '<option value="">Ders Seçin</option>';
  if (exam && CURRICULUM_DATA[exam]) {
    Object.keys(CURRICULUM_DATA[exam]).forEach(sub => {
      subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
    });
  }
  populateFormTopics();
}

function populateFormTopics() {
  const exam = document.getElementById("formExam").value;
  const subject = document.getElementById("formSubject").value;
  const dl = document.getElementById("topicList");
  dl.innerHTML = "";
  if (exam && subject && CURRICULUM_DATA[exam][subject]) {
    CURRICULUM_DATA[exam][subject].forEach(topic => {
      dl.innerHTML += `<option value="${topic}"></option>`;
    });
  }
}

/* ==========================================================================
   SORU İŞLEMLERİ
   ========================================================================== */
function openAddModal() { document.getElementById("addModal").classList.add("active"); }
function closeAddModal() {
  document.getElementById("addModal").classList.remove("active");
  document.getElementById("addQuestionForm").reset();
}

async function saveQuestion(e) {
  e.preventDefault();
  const qFileInput = document.getElementById("inputQuestionImg").files[0];
  const sFileInput = document.getElementById("inputSolutionImg").files[0];

  if (!qFileInput) { alert("Lütfen soru görseli seçin."); return; }

  const questionImgBase64 = await compressImage(qFileInput);
  const solutionImgBase64 = sFileInput ? await compressImage(sFileInput) : null;

  const newQuestion = {
    id: "q_" + Date.now(),
    exam: document.getElementById("formExam").value,
    subject: document.getElementById("formSubject").value,
    topic: document.getElementById("formTopic").value,
    reason: document.getElementById("formReason").value,
    notes: document.getElementById("formNotes").value,
    questionImg: questionImgBase64,
    solutionImg: solutionImgBase64,
    createdAt: new Date().toISOString()
  };

  await dbPut(newQuestion);
  closeAddModal();
  loadQuestions();
}

async function removeQuestion(id) {
  if (confirm("Bu soruyu silmek istediğinize emin misiniz?")) {
    await dbDelete(id);
    loadQuestions();
  }
}

async function loadQuestions() {
  allQuestionsCache = await dbGetAll();
  updateStats(allQuestionsCache);
  renderQuestions(allQuestionsCache);
}

function updateStats(data) {
  document.getElementById("stat-total").innerText = data.length;
  document.getElementById("stat-bilgi").innerText = data.filter(q => q.reason === "Bilgi Eksikliği").length;
  document.getElementById("stat-dikkat").innerText = data.filter(q => q.reason === "Dikkat/İşlem Hatası").length;
  document.getElementById("stat-sure").innerText = data.filter(q => q.reason === "Süre/Yetiştirememe").length;
  document.getElementById("stat-yorum").innerText = data.filter(q => q.reason === "Yeni Nesil/Yorum").length;
}

function getBadgeClass(reason) {
  switch (reason) {
    case "Bilgi Eksikliği": return "badge-bilgi";
    case "Dikkat/İşlem Hatası": return "badge-dikkat";
    case "Süre/Yetiştirememe": return "badge-sure";
    case "Yeni Nesil/Yorum": return "badge-yorum";
    default: return "badge-bilgi";
  }
}

function renderQuestions(items) {
  const container = document.getElementById("questionList");
  container.innerHTML = "";

  if (items.length === 0) {
    container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:3rem; color:var(--text-muted);">Arşivde soru bulunmuyor.</div>`;
    return;
  }

  items.forEach(q => {
    const card = document.createElement("div");
    card.className = "q-card";
    card.innerHTML = `
      <div class="q-header">
        <strong>${q.exam} - ${q.subject}</strong>
        <span class="badge ${getBadgeClass(q.reason)}">${q.reason}</span>
      </div>
      <div class="q-body">
        <div style="font-size:0.85rem; font-weight:700;">${q.topic}</div>
        <div class="q-image-wrap">
          <img src="${q.questionImg}" alt="Soru">
        </div>
        ${q.solutionImg ? `
          <button class="btn btn-sm" onclick="toggleSolution('${q.id}')" style="align-self: flex-start;">💡 Çözümü Göster/Gizle</button>
          <div class="solution-box sol-img" id="sol_${q.id}">
            <div class="q-image-wrap">
              <img src="${q.solutionImg}" alt="Çözüm">
            </div>
          </div>
        ` : ''}
        ${q.notes ? `<div style="font-size:0.78rem; color:var(--text-muted); background:rgba(0,0,0,0.03); padding:6px; border-radius:4px;"><strong>Not:</strong> ${q.notes}</div>` : ''}
      </div>
      <div class="q-footer">
        <button class="btn btn-sm btn-primary" onclick="openScratchpad('${q.questionImg}')">✏️ Üstünde Çöz</button>
        <button class="btn btn-sm" style="color:#ef4444;" onclick="removeQuestion('${q.id}')">Sil</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleSolution(id) {
  document.getElementById("sol_" + id).classList.toggle("active");
}

/* ==========================================================================
   FİLTRE & RASTGELE TEST
   ========================================================================== */
function applyFilters() {
  const exam = document.getElementById("filterExam").value;
  const sub = document.getElementById("filterSubject").value;
  const reason = document.getElementById("filterReason").value;
  const text = document.getElementById("filterText").value.toLowerCase();

  const filtered = allQuestionsCache.filter(q => {
    return (!exam || q.exam === exam) &&
           (!sub || q.subject === sub) &&
           (!reason || q.reason === reason) &&
           (!text || q.topic.toLowerCase().includes(text) || (q.notes && q.notes.toLowerCase().includes(text)));
  });
  renderQuestions(filtered);
}

function startRandomQuiz() {
  if (allQuestionsCache.length < 5) { alert("En az 5 soru gereklidir."); return; }
  const shuffled = [...allQuestionsCache].sort(() => 0.5 - Math.random());
  renderQuestions(shuffled.slice(0, 5));
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

/* ==========================================================================
   YAZDIRMA / PDF MODÜLÜ
   ========================================================================== */
function openPrintModal() { document.getElementById("printModal").classList.add("active"); }
function closePrintModal() { document.getElementById("printModal").classList.remove("active"); }

function executePrint(mode) {
  closePrintModal();
  document.body.classList.remove("print-questions-only", "print-solutions-only", "print-both");
  document.body.classList.add("print-" + mode);
  window.print();
}

/* ==========================================================================
   DİJİTAL ÇİZİM TUVALİ (CANVAS)
   ========================================================================== */
let isDrawing = false;
let canvasCtx;
let bgImageCache = null;

function initCanvas() {
  const canvas = document.getElementById("drawCanvas");
  canvasCtx = canvas.getContext("2d");

  const startDraw = (e) => {
    isDrawing = true;
    const pos = getPos(e);
    canvasCtx.beginPath();
    canvasCtx.moveTo(pos.x, pos.y);
  };
  const draw = (e) => {
    if (!isDrawing) return;
    const pos = getPos(e);
    canvasCtx.strokeStyle = document.getElementById("penColor").value;
    canvasCtx.lineWidth = document.getElementById("penSize").value;
    canvasCtx.lineCap = "round";
    canvasCtx.lineJoin = "round";
    canvasCtx.lineTo(pos.x, pos.y);
    canvasCtx.stroke();
  };
  const stopDraw = () => { isDrawing = false; };
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", draw);
  window.addEventListener("mouseup", stopDraw);
  canvas.addEventListener("touchstart", startDraw, { passive: false });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); }, { passive: false });
  window.addEventListener("touchend", stopDraw);
}

function openScratchpad(imgSrc) {
  document.getElementById("canvasModal").classList.add("active");
  const container = document.getElementById("canvasContainer");
  const canvas = document.getElementById("drawCanvas");
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;

  const img = new Image();
  img.src = imgSrc;
  img.onload = () => { bgImageCache = img; redrawBoardBackground(); };
}

function redrawBoardBackground() {
  if (!bgImageCache) return;
  const canvas = document.getElementById("drawCanvas");
  canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
  const ratio = Math.min(canvas.width / bgImageCache.width, canvas.height / bgImageCache.height, 1);
  canvasCtx.drawImage(bgImageCache, 0, 0, bgImageCache.width, bgImageCache.height, (canvas.width - bgImageCache.width * ratio) / 2, (canvas.height - bgImageCache.height * ratio) / 2, bgImageCache.width * ratio, bgImageCache.height * ratio);
}

function clearCanvas() { redrawBoardBackground(); }
function closeBoard() { document.getElementById("canvasModal").classList.remove("active"); }

/* ==========================================================================
   YEDEKLEME (JSON)
   ========================================================================== */
function exportData() {
  if (allQuestionsCache.length === 0) { alert("Yedeklenecek veri yok."); return; }
  const blob = new Blob([JSON.stringify(allQuestionsCache, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Soru_Tekrari_Yedek_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const items = JSON.parse(e.target.result);
      if (Array.isArray(items)) {
        for (const item of items) { await dbPut(item); }
        alert("Yedek başarıyla yüklendi.");
        loadQuestions();
      }
    } catch (err) { alert("Dosya okunamadı."); }
  };
  reader.readAsText(file);
}

window.addEventListener("DOMContentLoaded", async () => {
  await initDB();
  initDropdowns();
  initCanvas();
  loadQuestions();
});
</script>
