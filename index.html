<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SORU TEKRARI | Yıldıray Hoca</title>
  <meta name="theme-color" content="#09090b">
  
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Soru%20Tekrar%C4%B1%22%2C%22short_name%22%3A%22SoruTekrari%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soru Tekrarı">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --success: #10b981;
      --danger: #ef4444;
      --nav-height: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: calc(var(--nav-height) + 16px); min-height: 100vh; min-height: 100dvh; overflow-x: hidden; user-select: none; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      background: rgba(9, 9, 11, 0.85);
      border-bottom: 1px solid var(--card-border);
      height: 52px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; }
    .brand-name { font-size: 1rem; font-weight: 800; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .streak-badge { display: flex; align-items: center; gap: 4px; background: rgba(236, 72, 153, 0.15); border: 1px solid rgba(236, 72, 153, 0.3); padding: 4px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; color: #f472b6; }

    .tab-view { display: none; padding: 12px 14px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.2s ease-out; }
    .tab-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* PRATİK SEKME MOBİL UYUMU */
    #tab-practice.active {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - 52px - var(--nav-height) - 10px);
      padding: 6px 12px;
      overflow: hidden;
    }
    .practice-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .tinder-stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      touch-action: none;
    }
    .tinder-card {
      position: absolute;
      width: 100%;
      height: 100%;
      max-height: 100%;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      cursor: grab;
      user-select: none;
      transform-origin: 50% 100%;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
      touch-action: none;
    }
    .tinder-card.dragging { transition: none; cursor: grabbing; }
    .card-flipper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1); border-radius: 18px; }
    .card-flipper.flipped { transform: rotateY(180deg); }
    .flip-front, .flip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .flip-back { transform: rotateY(180deg); background: #121215; }

    .stamp-badge {
      position: absolute;
      top: 18px;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 1rem;
      text-transform: uppercase;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      border-width: 3px;
      border-style: solid;
    }
    .stamp-like { right: 16px; border-color: var(--success); color: var(--success); transform: rotate(15deg); }
    .stamp-dislike { left: 16px; border-color: var(--danger); color: var(--danger); transform: rotate(-15deg); }

    .tinder-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      margin: 8px auto 0 auto;
      flex-shrink: 0;
    }
    .tinder-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tinder-btn-no { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .tinder-btn-yes { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }

    /* Yatay Filtre Çipleri */
    .pills-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill-chip { padding: 6px 12px; border-radius: 999px; background: var(--card-bg); border: 1px solid var(--card-border); font-size: 0.75rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
    .pill-chip.active { background: #fff; color: #000; border-color: #fff; }

    /* Akış Kartları */
    .feed-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
    .card-top { padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .tag-exam { font-weight: 700; color: var(--accent-cyan); }
    .tag-reason { background: rgba(239, 68, 68, 0.15); color: #f87171; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 0.65rem; }
    .card-image-wrap { width: 100%; height: 200px; background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .card-image-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .card-body { padding: 10px 12px; }
    .topic-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
    .note-text { font-size: 0.75rem; color: var(--text-muted); background: rgba(0,0,0,0.25); padding: 5px 8px; border-radius: 6px; margin-top: 6px; }

    .card-actions { padding: 8px 12px 10px; display: flex; gap: 6px; align-items: center; }
    .btn-action { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-solve { background: var(--accent-gradient); border: none; font-weight: 700; color: #fff; }

    /* Form Girişi */
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    select, input, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; background: #18181b !important; color: #f4f4f5 !important; border: 1px solid var(--card-border); font-size: 0.85rem; outline: none;
    }
    select option { background-color: #18181b !important; color: #f4f4f5 !important; }

    /* Alt Bar */
    nav.bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-height);
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-item.active { color: #fff; }
    .nav-item.active svg { stroke: url(#gradient); }

    .nav-center-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent-gradient);
      border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
      cursor: pointer;
      transform: translateY(-6px);
    }
    .nav-center-btn svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.5; }

    .canvas-modal { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
    .canvas-modal.active { display: flex; }
    .canvas-nav { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; background: #121215; border-bottom: 1px solid var(--card-border); }
    .canvas-box { flex: 1; position: relative; overflow: hidden; touch-action: none; }
    #drawCanvas { position: absolute; top:0; left:0; }
  </style>
</head>
<body>

  <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
    <defs>
      <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="50%" stop-color="#a855f7" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>
    </defs>
  </svg>

  <header>
    <div class="brand">
      <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-name">SORU TEKRARI</div>
    </div>
    <div class="streak-badge">
      <span>🔥</span>
      <span id="streakCountText">1 Günlük Seri</span>
    </div>
  </header>

  <!-- TAB 1: AKIŞ -->
  <div id="tab-feed" class="tab-view active">
    <div class="pills-scroll" id="examPillContainer"></div>
    <div id="feedList"></div>
  </div>

  <!-- TAB 2: PRATİK -->
  <div id="tab-practice" class="tab-view">
    <div class="practice-hint">👆 Dokun: Çözümü Gör | ↔️ Kaydır: Karar Ver</div>
    <div class="tinder-stage" id="tinderStage"></div>
    <div class="tinder-buttons">
      <button class="tinder-btn tinder-btn-no" onclick="triggerCardSwipe('left')">👎 Tekrar Çöz</button>
      <button class="tinder-btn tinder-btn-yes" onclick="triggerCardSwipe('right')">👍 Anladım</button>
    </div>
  </div>

  <!-- TAB 3: RAPOR -->
  <div id="tab-analytics" class="tab-view">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
      <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:12px;">
        <div style="font-size:1.6rem; font-weight:900; color:var(--accent-cyan);" id="statTotalCount">0</div>
        <div style="font-size:0.7rem; color:var(--text-muted);">Toplam Arşiv</div>
      </div>
      <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:12px;">
        <div style="font-size:1.6rem; font-weight:900; color:#34d399;" id="statMasteredCount">0</div>
        <div style="font-size:0.7rem; color:var(--text-muted);">Öğrenildi / Kavrandı</div>
      </div>
    </div>
    <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:14px; margin-bottom:12px;">
      <h4 style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">Hata Nedenleri</h4>
      <div id="chartReasons" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
    <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:14px;">
      <h4 style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;">Ders Dağılımı</h4>
      <div id="chartSubjects" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>

  <!-- TAB 4: HIZLI EKLE -->
  <div id="tab-add" class="tab-view">
    <h3 style="font-size:1.1rem; font-weight:800; margin-bottom:12px; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Hızlı Soru Ekle</h3>
    <form id="addForm" onsubmit="handleQuestionSubmit(event)">
      <div class="input-group">
        <label>Sınav & Ders</label>
        <div style="display:flex; gap:6px;">
          <select id="formExamSelect" required onchange="renderSubjectDropdown()"></select>
          <select id="formSubjectSelect" required onchange="renderTopicDropdown()"></select>
        </div>
      </div>
      <div class="input-group">
        <label>Konu</label>
        <select id="formTopicSelect" onchange="if(this.value) document.getElementById('formTopicManual').value = this.value;">
          <option value="">-- Listeden Seçin --</option>
        </select>
        <input type="text" id="formTopicManual" placeholder="Veya buraya elle konu yazın" required style="margin-top:6px;">
      </div>
      <div class="input-group">
        <label>Hata Nedeni / Teşhis</label>
        <select id="formReasonSelect" required>
          <option value="Bilgi / Konu Eksikliği">Bilgi / Konu Eksikliği</option>
          <option value="Ön Bilgi (Ön Koşul) Eksikliği">Ön Bilgi (Ön Koşul) Eksikliği</option>
          <option value="Dikkat / İşlem Hatası">Dikkat / İşlem Hatası</option>
          <option value="Soru Kökünü Yanlış Okuma">Soru Kökünü Yanlış Okuma</option>
          <option value="Ön Yargı / Ezbere Yaklaşım">Ön Yargı / Ezbere Yaklaşım</option>
          <option value="Şıklar Arasında Kalıp Yanlış Seçme">Şıklar Arasında Kalıp Yanlış Seçme</option>
          <option value="Süre / Zaman Baskısı (Yetiştirememe)">Süre / Zaman Baskısı (Yetiştirememe)</option>
          <option value="Grafik / Şekil Yorumlama Hatası">Grafik / Şekil Yorumlama Hatası</option>
          <option value="Yorumsal / Yeni Nesil Tıkanıklığı">Yorumsal / Yeni Nesil Tıkanıklığı</option>
          <option value="Uykusuzluk / Zihinsel Yorgunluk">Uykusuzluk / Zihinsel Yorgunluk</option>
        </select>
      </div>
      <div class="input-group">
        <label>📸 Soru Görseli</label>
        <input type="file" id="formQImg" accept="image/*" required>
      </div>
      <div class="input-group">
        <label>💡 Çözüm Görseli (İsteğe Bağlı)</label>
        <input type="file" id="formSImg" accept="image/*">
      </div>
      <div class="input-group">
        <label>🎙️ Sesli Not</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" id="audioRecBtn" onclick="toggleAudio()" style="padding:6px 12px; background:#ef4444; color:#fff; border:none; border-radius:8px; font-size:0.75rem; font-weight:700; cursor:pointer;">🎙️ Kaydet</button>
          <span id="audioStatus" style="font-size:0.72rem; color:var(--text-muted);">Kayıt yok</span>
        </div>
        <audio id="audioPreview" controls style="width:100%; margin-top:6px; display:none; height:32px;"></audio>
      </div>
      <div class="input-group">
        <label>Not / Kaynak</label>
        <input type="text" id="formNotes" placeholder="Örn: 3D Yayınları Deneme 2">
      </div>
      <button type="submit" style="width:100%; padding:12px; border-radius:12px; background:var(--accent-gradient); border:none; color:#fff; font-weight:800; font-size:0.9rem; cursor:pointer; margin-top:4px;">
        Arşive Ekle 🚀
      </button>
    </form>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchNavTab('feed', this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Akış</span>
    </button>
    <button class="nav-item" onclick="switchNavTab('practice', this)">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      <span>Pratik</span>
    </button>
    <button class="nav-center-btn" onclick="switchNavTab('add', null)">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="nav-item" onclick="switchNavTab('analytics', this)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span>Rapor</span>
    </button>
  </nav>

  <div class="canvas-modal" id="canvasModal">
    <div class="canvas-nav">
      <button onclick="closeBoard()" style="background:none; border:none; color:#fff; font-weight:700; cursor:pointer;">✕ Kapat</button>
      <input type="color" id="penColor" value="#a855f7" style="border:none; width:28px; height:28px; border-radius:50%; background:none;">
      <button onclick="clearCanvas()" style="background:none; border:none; color:var(--danger); font-weight:700; cursor:pointer;">Temizle</button>
    </div>
    <div class="canvas-box" id="canvasBox">
      <canvas id="drawCanvas"></canvas>
    </div>
  </div>

const DB_NAME = "SoruTekrariDB_YildirayHoca";
const STORE_NAME = "questions";
let db;
let allQuestions = [];
let activeExam = "";

function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
  });
}

function dbPut(item) {
  return new Promise((resolve) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).put(item);
    tx.oncomplete = () => resolve();
  });
}

function dbGetAll() {
  return new Promise((resolve) => {
    const tx = db.transaction([STORE_NAME], "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}

function dbDelete(id) {
  return new Promise((resolve) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
  });
}

function compressImg(file) {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.readAsDataURL(file);
    r.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxW = 1000;
        let w = img.width, h = img.height;
        if (w > maxW) { h = (h * maxW) / w; w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
    };
  });
}

function updateStreakDisplay() {
  const today = new Date().toISOString().slice(0, 10);
  const lastActive = localStorage.getItem("streak_last_date");
  let count = parseInt(localStorage.getItem("streak_count") || "1", 10);

  if (lastActive && lastActive !== today) {
    const diffDays = Math.round((new Date(today) - new Date(lastActive)) / (1000 * 60 * 60 * 24));
    if (diffDays === 1) count++;
    else if (diffDays > 1) count = 1;
  }
  localStorage.setItem("streak_last_date", today);
  localStorage.setItem("streak_count", count);
  document.getElementById("streakCountText").innerText = `${count} Günlük Seri`;
}

function attachMobileSwipeEvents(el) {
  let isDragging = false;
  let startX = 0, currentDeltaX = 0;
  let startY = 0;
  let startTime = 0;

  const onTouchStart = (e) => {
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    currentDeltaX = 0;
    startTime = Date.now();
    el.classList.add("dragging");
  };

  const onTouchMove = (e) => {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    currentDeltaX = clientX - startX;
    const deltaY = clientY - startY;

    // Yatay sürükleme baskınsa sayfa kaydırmasını engelle
    if (Math.abs(currentDeltaX) > Math.abs(deltaY) && e.cancelable) {
      e.preventDefault();
    }

    const rot = currentDeltaX * 0.07;
    el.style.transform = `translateX(${currentDeltaX}px) rotate(${rot}deg)`;

    const likeStamp = el.querySelector(".stamp-like");
    const dislikeStamp = el.querySelector(".stamp-dislike");
    if (currentDeltaX > 0) {
      likeStamp.style.opacity = Math.min(currentDeltaX / 70, 1);
      dislikeStamp.style.opacity = 0;
    } else {
      dislikeStamp.style.opacity = Math.min(Math.abs(currentDeltaX) / 70, 1);
      likeStamp.style.opacity = 0;
    }
  };

  const onTouchEnd = () => {
    if (!isDragging) return;
    isDragging = false;
    el.classList.remove("dragging");

    const timeDiff = Date.now() - startTime;
    // Hızlı dokunuş (tap) algılama -> Çözümü Çevir
    if (Math.abs(currentDeltaX) < 10 && timeDiff < 250) {
      document.getElementById("currentFlipper").classList.toggle("flipped");
      return;
    }

    // Sağa / Sola Fırlatma eşiği
    if (currentDeltaX > 80) {
      finalizeSwipe("right");
    } else if (currentDeltaX < -80) {
      finalizeSwipe("left");
    } else {
      el.style.transform = "translateX(0px) rotate(0deg)";
      el.querySelector(".stamp-like").style.opacity = 0;
      el.querySelector(".stamp-dislike").style.opacity = 0;
    }
  };

  el.addEventListener("touchstart", onTouchStart, { passive: false });
  el.addEventListener("touchmove", onTouchMove, { passive: false });
  el.addEventListener("touchend", onTouchEnd);

  el.addEventListener("mousedown", onTouchStart);
  window.addEventListener("mousemove", (e) => { if(isDragging) onTouchMove(e); });
  window.addEventListener("mouseup", () => { if(isDragging) onTouchEnd(); });
}

function finalizeSwipe(dir) {
  const card = document.getElementById("currentTinderCard");
  if (!card) return;

  const moveOut = dir === "right" ? window.innerWidth + 120 : -window.innerWidth - 120;
  card.style.transform = `translateX(${moveOut}px) rotate(${dir === "right" ? 22 : -22}deg)`;
  card.style.opacity = "0";

  setTimeout(() => {
    if (dir === "right") {
      let mastered = parseInt(localStorage.getItem("mastered_count") || "0", 10) + 1;
      localStorage.setItem("mastered_count", mastered);
    }
    tinderQueue.shift();
    renderTopTinderCard();
  }, 160);
}

function triggerCardSwipe(dir) {
  finalizeSwipe(dir);
}

function renderAnalytics() {
  document.getElementById("statTotalCount").innerText = allQuestions.length;
  document.getElementById("statMasteredCount").innerText = localStorage.getItem("mastered_count") || "0";

  const reasons = {}, subjects = {};
  allQuestions.forEach(q => {
    reasons[q.reason] = (reasons[q.reason] || 0) + 1;
    subjects[q.subject] = (subjects[q.subject] || 0) + 1;
  });

  const maxR = Math.max(...Object.values(reasons), 1);
  const rBox = document.getElementById("chartReasons");
  rBox.innerHTML = "";
  for (const [r, c] of Object.entries(reasons)) {
    const pct = (c / maxR) * 100;
    rBox.innerHTML += `
      <div style="display:flex; align-items:center; gap:8px; font-size:0.72rem;">
        <span style="width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;">${r}</span>
        <div style="flex:1; background:rgba(255,255,255,0.06); height:6px; border-radius:3px; overflow:hidden;">
          <div style="width:${pct}%; background:var(--accent-purple); height:100%;"></div>
        </div>
        <span style="font-weight:700; width:18px; text-align:right;">${c}</span>
      </div>
    `;
  }

  const maxS = Math.max(...Object.values(subjects), 1);
  const sBox = document.getElementById("chartSubjects");
  sBox.innerHTML = "";
  for (const [s, c] of Object.entries(subjects)) {
    const pct = (c / maxS) * 100;
    sBox.innerHTML += `
      <div style="display:flex; align-items:center; gap:8px; font-size:0.72rem;">
        <span style="width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;">${s}</span>

        </div>
        <span style="font-weight:700; width:18px; text-align:right;">${c}</span>

let mediaRec, audioBlobBase64 = null, audioChunks = [];
function toggleAudio() {
  const btn = document.getElementById("audioRecBtn");
  const status = document.getElementById("audioStatus");
  const player = document.getElementById("audioPreview");

  if (!mediaRec || mediaRec.state === "inactive") {
    audioChunks = [];
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      mediaRec = new MediaRecorder(stream);
      mediaRec.start();
      btn.innerText = "⏹️ Bitir";
      status.innerText = "Kaydediliyor...";
      mediaRec.ondataavailable = e => audioChunks.push(e.data);
      mediaRec.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          audioBlobBase64 = reader.result;
          player.src = audioBlobBase64;
          player.style.display = "block";
          status.innerText = "Ses hazır!";
        };
      };
    }).catch(() => alert("Mikrofon izni alınamadı."));
  } else {
    mediaRec.stop();
    mediaRec.stream.getTracks().forEach(t => t.stop());
    btn.innerText = "🎙️ Yeniden Kaydet";
  }
}

async function handleQuestionSubmit(e) {
  e.preventDefault();
  const qF = document.getElementById("formQImg").files[0];
  const sF = document.getElementById("formSImg").files[0];
  const topic = document.getElementById("formTopicManual").value.trim();

  if (!qF) return alert("Soru görseli zorunludur.");
  if (!topic) return alert("Lütfen konu belirtin.");

  const item = {
    id: "q_" + Date.now(),
    exam: document.getElementById("formExamSelect").value,
    subject: document.getElementById("formSubjectSelect").value,
    topic: topic,
    reason: document.getElementById("formReasonSelect").value,
    notes: document.getElementById("formNotes").value,
    audioData: audioBlobBase64,
    questionImg: await compressImg(qF),
    solutionImg: sF ? await compressImg(sF) : null,
    createdAt: new Date().toISOString()
  };

  await dbPut(item);
  document.getElementById("addForm").reset();
  audioBlobBase64 = null;
  document.getElementById("audioPreview").style.display = "none";
  document.getElementById("audioStatus").innerText = "Kayıt yok";

  await refreshAll();
  switchNavTab("feed", document.querySelector(".bottom-nav .nav-item"));
}

/* ÇİZİM */
let canvasCtx, isPainting = false, cachedBg = null;
function initCanvasEvents() {
  const c = document.getElementById("drawCanvas");
  canvasCtx = c.getContext("2d");
  const getP = e => {
    const r = c.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  };
  const onD = e => { isPainting = true; const p = getP(e); canvasCtx.beginPath(); canvasCtx.moveTo(p.x, p.y); };
  const onM = e => {
    if (!isPainting) return;
    const p = getP(e);
    canvasCtx.strokeStyle = document.getElementById("penColor").value;
    canvasCtx.lineWidth = 3;
    canvasCtx.lineCap = "round";
    canvasCtx.lineTo(p.x, p.y);
    canvasCtx.stroke();
  };
  const onU = () => isPainting = false;
  c.addEventListener("mousedown", onD); c.addEventListener("mousemove", onM); window.addEventListener("mouseup", onU);
  c.addEventListener("touchstart", onD, {passive:false}); c.addEventListener("touchmove", e => { e.preventDefault(); onM(e); }, {passive:false}); window.addEventListener("touchend", onU);
}

function openScratchpad(src) {
  document.getElementById("canvasModal").classList.add("active");
  const b = document.getElementById("canvasBox");
  const c = document.getElementById("drawCanvas");
  c.width = b.clientWidth; c.height = b.clientHeight;
  const im = new Image();
  im.src = src;
  im.onload = () => {
    cachedBg = im;
    const r = Math.min(c.width / im.width, c.height / im.height, 1);
    canvasCtx.drawImage(im, 0, 0, im.width, im.height, (c.width - im.width*r)/2, (c.height - im.height*r)/2, im.width*r, im.height*r);
  };
}
function clearCanvas() { if (cachedBg) openScratchpad(cachedBg.src); }
function closeBoard() { document.getElementById("canvasModal").classList.remove("active"); }

async function refreshAll() {
  allQuestions = await dbGetAll();
  renderFeed();
}
