<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SORU TEKRARI | Yıldıray Hoca</title>
  <meta name="theme-color" content="#09090b">
  
  <!-- PWA & Masaüstü Uygulama / iOS Tam Ekran Entegrasyonu -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Soru%20Tekrar%C4%B1%22%2C%22short_name%22%3A%22SoruTekrar%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soru Tekrarı">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --header-bg: #ffffff;
    }

    html.dark {
      --bg: #09090b;
      --card-bg: #121215;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --header-bg: #121215;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; transition: background 0.3s, color 0.3s; }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-area { display: flex; align-items: center; gap: 12px; }
    .logo-img { height: 40px; width: auto; object-fit: contain; }
    .logo-text { display: flex; flex-direction: column; }
    .logo-title { font-size: 1.15rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
    .creator-tag { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .nav-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn {
      padding: 0.5rem 0.85rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      font-size: 0.825rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }

    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .stat-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .stat-value { font-size: 1.4rem; font-weight: 800; margin-top: 4px; }

    .filter-bar {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .filter-bar select, .filter-bar input {
      flex: 1;
      min-width: 140px;
      padding: 0.55rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      background: var(--bg);
      color: var(--text);
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .q-card {
      background: var(--card-bg);
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .q-header {
      padding: 0.75rem 1rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    .badge { padding: 3px 8px; border-radius: 9999px; font-size: 0.68rem; font-weight: 700; color: #fff; }
    .badge-bilgi { background: #ef4444; }
    .badge-dikkat { background: #f59e0b; color: #000; }
    .badge-sure { background: #06b6d4; color: #000; }
    .badge-yorum { background: #8b5cf6; }

    .q-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    
    .q-image-wrap {
      width: 100%;
      height: 200px;
      border-radius: 0.5rem;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-in;
      border: 1px solid var(--border);
    }
    .q-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .solution-box { border: 1px dashed var(--border); border-radius: 0.5rem; overflow: hidden; display: none; background: rgba(0,0,0,0.02); }
    .solution-box.active { display: block; }

    .q-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 10px;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--card-bg); border-radius: 0.75rem; width: 100%; max-width: 550px;
      max-height: 90vh; overflow-y: auto; padding: 1.5rem; border: 1px solid var(--border);
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    .form-group select, .form-group input, .form-group textarea {
      width: 100%; padding: 0.55rem; border-radius: 0.375rem; border: 1px solid var(--border);
      font-size: 0.9rem; background: var(--bg); color: var(--text);
    }

    .canvas-modal {
      position: fixed; inset: 0; background: #09090b; z-index: 200; display: none; flex-direction: column;
    }
    .canvas-modal.active { display: flex; }
    .canvas-toolbar { padding: 10px; background: #121215; display: flex; gap: 10px; align-items: center; color: #fff; flex-wrap: wrap; border-bottom: 1px solid #27272a; }
    .canvas-workspace { flex: 1; position: relative; overflow: hidden; touch-action: none; }
    #drawCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }

    .print-options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
    .print-option-btn { padding: 1rem; text-align: left; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); color: var(--text); cursor: pointer; font-weight: 600; }
    .print-option-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      header, .stats-grid, .filter-bar, .nav-actions, .q-footer, .modal-backdrop, .canvas-modal { display: none !important; }
      .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .question-grid { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 15px !important; }
      
      body.print-solutions-only .q-card:has(.no-solution) { display: none !important; }

      .q-card { border: 1px solid #999 !important; box-shadow: none !important; break-inside: avoid !important; background: #fff !important; color: #000 !important; margin-bottom: 15px; }
      .q-header { background: #eee !important; color: #000 !important; border-bottom: 1px solid #ccc !important; }
      .q-image-wrap { background: #fff !important; max-height: 250px !important; height: auto !important; }
      .q-image-wrap img { object-fit: contain !important; max-height: 230px !important; }
      .solution-box { border: 1px solid #999 !important; background: #fff !important; }
      
      body.print-questions-only .solution-box { display: none !important; }
      body.print-solutions-only .q-main-img { display: none !important; }
      body.print-solutions-only .solution-box { display: block !important; border: none !important; }
      body.print-both .solution-box { display: block !important; }
      @page { size: A4 portrait; margin: 10mm; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="brand-area">
      <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
      <div class="logo-text">
        <span class="logo-title">SORU TEKRARI</span>
        <span class="creator-tag">Hazırlayan: Yıldıray Hoca</span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary" onclick="openAddModal()">+ Soru Ekle</button>
      <button class="btn" onclick="startRandomQuiz()">🎲 Rastgele 5 Soru</button>
      <button class="btn" onclick="openPrintModal()">🖨️ PDF / Baskı Al</button>
      <button class="btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Aydınlık</button>
      <button class="btn" onclick="exportData()">💾 Yedek</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📥 Yükle</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</header>

<div class="container">
  <div class="stats-grid">
    <div class="stat-card" style="border-left-color: var(--primary);">
      <div class="stat-title">Toplam Arşiv</div>
      <div class="stat-value" id="stat-total">0</div>
    </div>
    <div class="stat-card" style="border-left-color: #ef4444;">
      <div class="stat-title">Bilgi Eksikliği</div>
      <div class="stat-value" id="stat-bilgi">0</div>
    </div>
    <div class="stat-card" style="border-left-color: #f59e0b;">
      <div class="stat-title">Dikkat Hatası</div>
      <div class="stat-value" id="stat-dikkat">0</div>
    </div>
    <div class="stat-card" style="border-left-color: #06b6d4;">
      <div class="stat-title">Süre Problemi</div>
      <div class="stat-value" id="stat-sure">0</div>
    </div>
    <div class="stat-card" style="border-left-color: #8b5cf6;">
      <div class="stat-title">Yeni Nesil / Yorum</div>
      <div class="stat-value" id="stat-yorum">0</div>
    </div>
  </div>

  <div class="filter-bar">
    <select id="filterExam" onchange="filterExamChanged();">
      <option value="">Tüm Sınavlar</option>
    </select>
    <select id="filterSubject" onchange="filterSubjectChanged();">
      <option value="">Tüm Dersler</option>
    </select>
    <select id="filterTopic" onchange="applyFilters();">
      <option value="">Tüm Konular</option>
    </select>
    <select id="filterReason" onchange="applyFilters();">
      <option value="">Tüm Hata Tipleri</option>
      <option value="Bilgi Eksikliği">Bilgi Eksikliği</option>
      <option value="Dikkat/İşlem Hatası">Dikkat/İşlem Hatası</option>
      <option value="Süre/Yetiştirememe">Süre/Yetiştirememe</option>
      <option value="Yeni Nesil/Yorum">Yeni Nesil/Yorum</option>
    </select>
    <input type="text" id="filterText" placeholder="Kaynak veya not ara..." oninput="applyFilters()">
  </div>

  <div class="question-grid" id="questionList"></div>
</div>

<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h3 style="margin-bottom:1rem;">Yeni Soru Ekle</h3>
    <form id="addQuestionForm" onsubmit="saveQuestion(event)">
      <div class="form-group">
        <label>Sınav</label>
        <select id="formExam" required onchange="populateFormSubjects()"></select>
      </div>
      <div class="form-group">
        <label>Ders</label>
        <select id="formSubject" required onchange="populateFormTopics()"></select>
      </div>
      <div class="form-group">
        <label>Konu (Listeden Seçin Veya Aşağıya Elle Yazın)</label>
        <select id="formTopicSelect" class="form-control" style="margin-bottom:6px;" onchange="onTopicSelectChanged(this.value)">
          <option value="">-- Listeden Konu Seçin --</option>
        </select>
        <input type="text" id="formTopic" required placeholder="Veya buraya elle konu yazın">
      </div>
      <div class="form-group">
        <label>Hata Nedeni</label>
        <select id="formReason" required>
          <option value="Bilgi Eksikliği">Bilgi Eksikliği</option>
          <option value="Dikkat/İşlem Hatası">Dikkat/İşlem Hatası</option>
          <option value="Süre/Yetiştirememe">Süre/Yetiştirememe</option>
          <option value="Yeni Nesil/Yorum">Yeni Nesil/Yorum</option>
        </select>
      </div>
      <div class="form-group">
        <label>Soru Görseli (Zorunlu)</label>
        <input type="file" id="inputQuestionImg" accept="image/*" required>
      </div>
      <div class="form-group">
        <label>Çözüm Görseli (İsteğe Bağlı)</label>
        <input type="file" id="inputSolutionImg" accept="image/*">
      </div>
      <div class="form-group">
        <label>Kaynak / Not / Hatırlatıcı</label>
        <textarea id="formNotes" rows="2" placeholder="Örn: 3D Yayınları Deneme 4"></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:1rem;">
        <button type="button" class="btn" onclick="closeAddModal()">İptal</button>
        <button type="submit" class="btn btn-primary">Arşive Kaydet</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="printModal">
  <div class="modal">
    <h3 style="margin-bottom:0.5rem;">Yazdırma / PDF Formatı Seçin</h3>
    <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:1rem;">A4 çift sütun test düzeni için tercih belirleyin:</p>
    <div class="print-options-grid">
      <button class="print-option-btn" onclick="executePrint('questions-only')">📄 Sadece Sorular (Klasik Test)</button>
      <button class="print-option-btn" onclick="executePrint('solutions-only')">💡 Sadece Çözümler (Çözümü Olanlar)</button>
      <button class="print-option-btn" onclick="executePrint('both')">📑 Soru + Çözüm Alt Alta (Çalışma Kağıdı)</button>
    </div>
    <div style="display:flex; justify-content:flex-end; margin-top:1.5rem;">
      <button type="button" class="btn" onclick="closePrintModal()">İptal</button>
    </div>
  </div>
</div>

<div class="canvas-modal" id="canvasModal">
  <div class="canvas-toolbar">
    <button class="btn btn-sm" onclick="closeBoard()">Kapat (X)</button>
    <label>Renk: <input type="color" id="penColor" value="#3b82f6"></label>
    <label>Kalınlık: <input type="range" id="penSize" min="1" max="10" value="3"></label>
    <button class="btn btn-sm" onclick="clearCanvas()">Temizle</button>
    <span style="font-size:0.75rem; color:#a1a1aa; margin-left:auto;">Apple Pencil / Dokunmatik / Mouse Uyumlu</span>
  </div>
  <div class="canvas-workspace" id="canvasContainer">
    <canvas id="drawCanvas"></canvas>
  </div>
</div>

const DB_NAME = "SoruTekrariDB_YildirayHoca";
const DB_VERSION = 1;
const STORE_NAME = "questions";
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
    request.onerror = (e) => reject(e.target.errorCode);
  });
}

function dbPut(item) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE_NAME], "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function compressImage(file, maxWidth = 1200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

  filterExam.innerHTML = '<option value="">Tüm Sınavlar</option>';
  formExam.innerHTML = '<option value="">Sınav Seçin</option>';

  subSelect.innerHTML = '<option value="">Tüm Dersler</option>';
  
  if (exam && CURRICULUM_DATA[exam]) {

    });

}

async function saveQuestion(e) {
  e.preventDefault();
  const qFileInput = document.getElementById("inputQuestionImg").files[0];
  const sFileInput = document.getElementById("inputSolutionImg").files[0];
  const topicVal = document.getElementById("formTopic").value.trim();

  if (!qFileInput) { alert("Lütfen soru görseli seçin."); return; }
  if (!topicVal) { alert("Lütfen konu seçin veya yazın."); return; }

  const questionImgBase64 = await compressImage(qFileInput);
  const solutionImgBase64 = sFileInput ? await compressImage(sFileInput) : null;

  const newQuestion = {
    id: "q_" + Date.now(),
    exam: document.getElementById("formExam").value,
    subject: document.getElementById("formSubject").value,
    topic: topicVal,
    reason: document.getElementById("formReason").value,
    notes: document.getElementById("formNotes").value,
    questionImg: questionImgBase64,
    solutionImg: solutionImgBase64,
    createdAt: new Date().toISOString()
  };

  await dbPut(newQuestion);
  closeAddModal();
  loadQuestions();
}

async function removeQuestion(id) {
  if (confirm("Bu soruyu silmek istediğinize emin misiniz?")) {
    await dbDelete(id);
    loadQuestions();
  }
}

async function loadQuestions() {
  allQuestionsCache = await dbGetAll();
  updateStats(allQuestionsCache);
  renderQuestions(allQuestionsCache);
}

function updateStats(data) {
  document.getElementById("stat-total").innerText = data.length;
  document.getElementById("stat-bilgi").innerText = data.filter(q => q.reason === "Bilgi Eksikliği").length;
  document.getElementById("stat-dikkat").innerText = data.filter(q => q.reason === "Dikkat/İşlem Hatası").length;
  document.getElementById("stat-sure").innerText = data.filter(q => q.reason === "Süre/Yetiştirememe").length;
  document.getElementById("stat-yorum").innerText = data.filter(q => q.reason === "Yeni Nesil/Yorum").length;
}

function getBadgeClass(reason) {
  switch (reason) {
    case "Bilgi Eksikliği": return "badge-bilgi";
    case "Dikkat/İşlem Hatası": return "badge-dikkat";
    case "Süre/Yetiştirememe": return "badge-sure";
    case "Yeni Nesil/Yorum": return "badge-yorum";
    default: return "badge-bilgi";
  }
}

function renderQuestions(items) {
  const container = document.getElementById("questionList");
  container.innerHTML = "";

  if (items.length === 0) {
    container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:3rem; color:var(--text-muted);">Arşivde soru bulunmuyor.</div>`;
    return;
  }

  items.forEach(q => {
    const hasSolution = !!q.solutionImg;
    const card = document.createElement("div");
    card.className = `q-card ${hasSolution ? 'has-solution' : 'no-solution'}`;
    card.innerHTML = `
      <div class="q-header">
        <strong>${q.exam} - ${q.subject}</strong>
        <span class="badge ${getBadgeClass(q.reason)}">${q.reason}</span>
      </div>
      <div class="q-body">
        <div style="font-size:0.85rem; font-weight:700;">${q.topic}</div>
        <div class="q-image-wrap q-main-img">
          <img src="${q.questionImg}" alt="Soru" onclick="openScratchpad('${q.questionImg}')">
        </div>
        ${hasSolution ? `
          <button class="btn btn-sm" onclick="toggleSolution('${q.id}')" style="align-self: flex-start;">💡 Çözümü Göster/Gizle</button>
          <div class="solution-box" id="sol_${q.id}">
            <div class="q-image-wrap">
              <img src="${q.solutionImg}" alt="Çözüm">
            </div>
          </div>
        ` : ''}
        ${q.notes ? `<div style="font-size:0.78rem; color:var(--text-muted); background:rgba(0,0,0,0.03); padding:6px; border-radius:4px;"><strong>Not:</strong> ${q.notes}</div>` : ''}
      </div>
      <div class="q-footer">
        <button class="btn btn-sm btn-primary" onclick="openScratchpad('${q.questionImg}')">✏️ Üstünde Çöz</button>
        <button class="btn btn-sm" style="color:#ef4444;" onclick="removeQuestion('${q.id}')">Sil</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleSolution(id) {
  document.getElementById("sol_" + id).classList.toggle("active");
}

function applyFilters() {
  const exam = document.getElementById("filterExam").value;
  const sub = document.getElementById("filterSubject").value;
  const topic = document.getElementById("filterTopic").value;
  const reason = document.getElementById("filterReason").value;
  const text = document.getElementById("filterText").value.toLowerCase();

  const filtered = allQuestionsCache.filter(q => {
    return (!exam || q.exam === exam) &&
           (!sub || q.subject === sub) &&
           (!topic || q.topic === topic) &&
           (!reason || q.reason === reason) &&
           (!text || q.topic.toLowerCase().includes(text) || (q.notes && q.notes.toLowerCase().includes(text)));
  });
  renderQuestions(filtered);
}

function startRandomQuiz() {
  if (allQuestionsCache.length < 5) { alert("En az 5 soru gereklidir."); return; }
  const shuffled = [...allQuestionsCache].sort(() => 0.5 - Math.random());
  renderQuestions(shuffled.slice(0, 5));
  window.scrollTo({ top: 200, behavior: 'smooth' });
}

function openPrintModal() { document.getElementById("printModal").classList.add("active"); }
function closePrintModal() { document.getElementById("printModal").classList.remove("active"); }

function executePrint(mode) {
  closePrintModal();
  document.body.classList.remove("print-questions-only", "print-solutions-only", "print-both");
  document.body.classList.add("print-" + mode);
  window.print();
}

let isDrawing = false;
let canvasCtx;
let bgImageCache = null;

function initCanvas() {
  const canvas = document.getElementById("drawCanvas");
  canvasCtx = canvas.getContext("2d");

  const startDraw = (e) => {
    isDrawing = true;
    const pos = getPos(e);
    canvasCtx.beginPath();
    canvasCtx.moveTo(pos.x, pos.y);
  };
  const draw = (e) => {
    if (!isDrawing) return;
    const pos = getPos(e);
    canvasCtx.strokeStyle = document.getElementById("penColor").value;
    canvasCtx.lineWidth = document.getElementById("penSize").value;
    canvasCtx.lineCap = "round";
    canvasCtx.lineJoin = "round";
    canvasCtx.lineTo(pos.x, pos.y);
    canvasCtx.stroke();
  };
  const stopDraw = () => { isDrawing = false; };
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", draw);
  window.addEventListener("mouseup", stopDraw);
  canvas.addEventListener("touchstart", startDraw, { passive: false });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); }, { passive: false });
  window.addEventListener("touchend", stopDraw);
}

function openScratchpad(imgSrc) {
  document.getElementById("canvasModal").classList.add("active");
  const container = document.getElementById("canvasContainer");
  const canvas = document.getElementById("drawCanvas");
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;

  const img = new Image();
  img.src = imgSrc;
  img.onload = () => { bgImageCache = img; redrawBoardBackground(); };
}

function redrawBoardBackground() {
  if (!bgImageCache) return;
  const canvas = document.getElementById("drawCanvas");
  canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
  const ratio = Math.min(canvas.width / bgImageCache.width, canvas.height / bgImageCache.height, 1);
  canvasCtx.drawImage(bgImageCache, 0, 0, bgImageCache.width, bgImageCache.height, (canvas.width - bgImageCache.width * ratio) / 2, (canvas.height - bgImageCache.height * ratio) / 2, bgImageCache.width * ratio, bgImageCache.height * ratio);
}

function clearCanvas() { redrawBoardBackground(); }
function closeBoard() { document.getElementById("canvasModal").classList.remove("active"); }

function exportData() {
  if (allQuestionsCache.length === 0) { alert("Yedeklenecek veri yok."); return; }
  const blob = new Blob([JSON.stringify(allQuestionsCache, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Soru_Tekrari_Yedek_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const items = JSON.parse(e.target.result);
      if (Array.isArray(items)) {
        for (const item of items) { await dbPut(item); }
        alert("Yedek başarıyla yüklendi.");
        loadQuestions();
      }
    } catch (err) { alert("Dosya okunamadı."); }
  };
  reader.readAsText(file);
}

window.addEventListener("DOMContentLoaded", async () => {
  await initDB();
  initDropdowns();
  initCanvas();
  loadQuestions();
});
