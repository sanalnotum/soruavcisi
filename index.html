<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Soru Avcısı | Yıldıray Hoca</title>
  <meta name="theme-color" content="#09090b">
  
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Soru%20Avc%C4%B1s%C4%B1%22%2C%22short_name%22%3A%22SoruAvcisi%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%2309090b%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soru Avcısı">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --success: #10b981;
      --danger: #f43f5e;
      --nav-height: 70px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: calc(var(--nav-height) + 20px); min-height: 100vh; overflow-x: hidden; user-select: none; }

    /* Üst Bar (Header) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      background: rgba(9, 9, 11, 0.8);
      border-bottom: 1px solid var(--card-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 34px; height: 34px; border-radius: 10px; object-fit: contain; }
    .brand-name { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .streak-badge { display: flex; align-items: center; gap: 4px; background: rgba(236, 72, 153, 0.15); border: 1px solid rgba(236, 72, 153, 0.3); padding: 5px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: #f472b6; }

    /* Tab Görünümleri */
    .tab-view { display: none; padding: 16px 20px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.25s ease-out; }
    .tab-view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Pill Filter Kaydırıcı */
    .pills-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; scrollbar-width: none; }
    .pills-scroll::-webkit-scrollbar { display: none; }
    .pill-chip { padding: 6px 14px; border-radius: 999px; background: var(--card-bg); border: 1px solid var(--card-border); font-size: 0.78rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: all 0.2s; }
    .pill-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* Soru Kartları (Feed) */
    .feed-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      transition: transform 0.15s;
    }
    .feed-card:active { transform: scale(0.99); }
    .card-top { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .tag-exam { font-weight: 700; color: var(--accent-cyan); }
    .tag-reason { background: rgba(244, 63, 94, 0.15); color: #fb7185; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 0.7rem; }
    
    .card-image-wrap { width: 100%; height: 210px; background: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .card-image-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .card-body { padding: 14px 16px; }
    .topic-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; }
    .note-text { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }

    .card-actions { padding: 10px 16px 14px; display: flex; gap: 8px; align-items: center; }
    .btn-action { flex: 1; padding: 9px; border-radius: 12px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.78rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-action:active { background: rgba(255,255,255,0.15); }
    .btn-solve { background: var(--accent-gradient); border: none; font-weight: 700; }

    /* Flaş Kart (Flipcard) Pratik Modu */
    .flashcard-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 65vh; }
    .flashcard {
      width: 100%;
      height: 420px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
    }
    .flashcard-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(20px);
    }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .flashcard-back { transform: rotateY(180deg); background: rgba(18, 18, 22, 0.95); }
    .flashcard-img-box { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; border-radius: 16px; }
    .flashcard-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .flashcard-controls { display: flex; gap: 12px; width: 100%; margin-top: 20px; }
    .btn-choice { flex: 1; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 0.9rem; border: none; cursor: pointer; transition: transform 0.1s; }
    .btn-choice:active { transform: scale(0.96); }
    .btn-again { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }
    .btn-easy { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }

    /* Form Girişi (Yeni Soru Ekleme) */
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .input-group select, .input-group input, .input-group textarea {
      width: 100%; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--card-border); color: var(--text); font-size: 0.9rem; outline: none;
    }
    .input-group select:focus, .input-group input:focus { border-color: var(--accent-purple); }

    /* Rapor & Analiz */
    .stat-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-hero-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .hero-num { font-size: 1.8rem; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

    /* Alt Gezinme Çubuğu (Bottom Nav) */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform 0.2s; }
    .nav-item.active { color: var(--text); }
    .nav-item.active svg { stroke: url(#gradient); transform: translateY(-2px); }

    /* Ortadaki Parlayan "+" Butonu */
    .nav-center-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-gradient);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
      cursor: pointer;
      transform: translateY(-8px);
      transition: transform 0.15s;
    }
    .nav-center-btn:active { transform: translateY(-8px) scale(0.92); }
    .nav-center-btn svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.5; }

    /* Çizim Modal */
    .canvas-modal { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
    .canvas-modal.active { display: flex; }
    .canvas-nav { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #121215; border-bottom: 1px solid var(--card-border); }
    .canvas-box { flex: 1; position: relative; overflow: hidden; touch-action: none; }
    #drawCanvas { position: absolute; top:0; left:0; }
  </style>
</head>
<body>

  <!-- SVG Gradient Tanımı -->
  <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
    <defs>
      <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="50%" stop-color="#a855f7" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>
    </defs>
  </svg>

  <header>
    <div class="brand">
      <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-name">SORU AVCISI</div>
    </div>
    <div class="streak-badge">
      <span>🔥</span>
      <span id="streakCount">3 Günlük Seri</span>
    </div>
  </header>

  <!-- TAB 1: AKIŞ (FEED / ARŞİV) -->
  <div id="tab-feed" class="tab-view active">
    <!-- Yatay Filtre Çipleri -->
    <div class="pills-scroll" id="examFilterPills">
      <div class="pill-chip active" onclick="setExamFilter('')">Tümü</div>
      <div class="pill-chip" onclick="setExamFilter('YKS-TYT')">YKS-TYT</div>
      <div class="pill-chip" onclick="setExamFilter('YKS-AYT')">YKS-AYT</div>
      <div class="pill-chip" onclick="setExamFilter('LGS')">LGS</div>
      <div class="pill-chip" onclick="setExamFilter('KPSS')">KPSS</div>
    </div>

    <!-- Soru Kartları -->
    <div id="feedList"></div>
  </div>

  <!-- TAB 2: PRATİK (FLIP / TEKRAR KARTLARI) -->
  <div id="tab-practice" class="tab-view">
    <div class="flashcard-stage" id="practiceContainer">
      <div class="flashcard" id="practiceFlashcard" onclick="flipCard()">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); margin-bottom:8px;" id="pCardHeader">SORU</div>
            <div class="flashcard-img-box">
              <img id="pCardFrontImg" src="" alt="Soru">
            </div>
            <div style="text-align:center; margin-top:10px; font-size:0.75rem; color:var(--text-muted);">Çözümü görmek için karta dokun 👆</div>
          </div>
          <div class="flashcard-back">
            <div style="font-size:0.75rem; font-weight:700; color:var(--accent-cyan); margin-bottom:8px;">ÇÖZÜM & NOT</div>
            <div class="flashcard-img-box">
              <img id="pCardBackImg" src="" alt="Çözüm">
            </div>
            <div id="pCardNote" style="font-size:0.8rem; margin-top:10px; color:var(--text);"></div>
          </div>
        </div>
      </div>
      <div class="flashcard-controls">
        <button class="btn-choice btn-again" onclick="nextPracticeCard(false)">👎 Tekrar Et</button>
        <button class="btn-choice btn-easy" onclick="nextPracticeCard(true)">👍 Anladım</button>
      </div>
    </div>
  </div>

  <!-- TAB 3: RAPOR (İSTATİSTİK & GRAFİK) -->
  <div id="tab-analytics" class="tab-view">
    <div class="stat-hero">
      <div class="stat-hero-card">
        <div class="hero-num" id="statTotalHero">0</div>
        <div class="hero-label">Toplam Yanlış Soru</div>
      </div>
      <div class="stat-hero-card">
        <div class="hero-num" id="statMasteredHero">0</div>
        <div class="hero-label">Öğrenilen / Kavranan</div>
      </div>
    </div>

    <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:18px; margin-bottom:16px;">
      <h4 style="font-size:0.8rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px;">En Sık Yapılan Hatalar</h4>
      <div id="reportReasonBars" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:18px;">
      <h4 style="font-size:0.8rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px;">Ders Dağılımı</h4>
      <div id="reportSubjectBars" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- TAB 4: YENİ SORU EKLE (HIZLI FORM) -->
  <div id="tab-add" class="tab-view">
    <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:14px; background:var(--accent-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Hızlı Soru Ekle</h3>
    
    <form id="fastAddForm" onsubmit="saveFastQuestion(event)">
      <div class="input-group">
        <label>Sınav & Ders</label>
        <div style="display:flex; gap:8px;">
          <select id="fExam" required onchange="onFastExamChange()">
            <option value="YKS-TYT">YKS-TYT</option>
            <option value="YKS-AYT">YKS-AYT</option>
            <option value="LGS">LGS</option>
            <option value="KPSS">KPSS</option>
            <option value="ALES">ALES</option>
          </select>
          <select id="fSubject" required onchange="onFastSubjectChange()"></select>
        </div>
      </div>

      <div class="input-group">
        <label>Konu</label>
        <select id="fTopicSelect" onchange="document.getElementById('fTopicCustom').value = this.value;"></select>
        <input type="text" id="fTopicCustom" placeholder="Veya elle konu adı yazın" required style="margin-top:6px;">
      </div>

      <div class="input-group">
        <label>Neden Yanlış Yaptın?</label>
        <select id="fReason" required>
          <option value="Bilgi / Konu Eksikliği">Bilgi / Konu Eksikliği</option>
          <option value="Ön Bilgi (Ön Koşul) Eksikliği">Ön Bilgi (Ön Koşul) Eksikliği</option>
          <option value="Dikkat / İşlem Hatası">Dikkat / İşlem Hatası</option>
          <option value="Soru Kökünü Yanlış Okuma">Soru Kökünü Yanlış Okuma</option>
          <option value="Ön Yargı / Ezbere Yaklaşım">Ön Yargı / Ezbere Yaklaşım</option>
          <option value="Süre / Zaman Baskısı">Süre / Zaman Baskısı</option>
          <option value="Yorumsal / Yeni Nesil Tıkanıklığı">Yorumsal / Yeni Nesil Tıkanıklığı</option>
        </select>
      </div>

      <div class="input-group">
        <label>📸 Soru Görseli</label>
        <input type="file" id="fQuestionImg" accept="image/*" required>
      </div>

      <div class="input-group">
        <label>💡 Çözüm Görseli (İsteğe Bağlı)</label>
        <input type="file" id="fSolutionImg" accept="image/*">
      </div>

      <div class="input-group">
        <label>Kısa Not / Hatırlatıcı</label>
        <input type="text" id="fNotes" placeholder="Örn: Formülü ters yazdım...">
      </div>

      <button type="submit" style="width:100%; padding:14px; border-radius:16px; background:var(--accent-gradient); border:none; color:#fff; font-weight:800; font-size:0.95rem; cursor:pointer; margin-top:10px;">
        Roketle & Kaydet 🚀
      </button>
    </form>
  </div>

  <!-- ALT MENÜ (BOTTOM NAVIGATION BAR) -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('feed', this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Akış</span>
    </button>
    <button class="nav-item" onclick="switchTab('practice', this)">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      <span>Pratik</span>
    </button>
    <button class="nav-center-btn" onclick="switchTab('add', null)">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="nav-item" onclick="switchTab('analytics', this)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span>Rapor</span>
    </button>
  </nav>

  <!-- Çizim Modalı -->
  <div class="canvas-modal" id="canvasModal">
    <div class="canvas-nav">
      <button onclick="closeBoard()" style="background:none; border:none; color:#fff; font-weight:700;">✕ Kapat</button>
      <input type="color" id="penColor" value="#a855f7" style="border:none; width:30px; height:30px; border-radius:50%; background:none;">
      <button onclick="clearCanvas()" style="background:none; border:none; color:#ef4444; font-weight:700;">Temizle</button>
    </div>
    <div class="canvas-box" id="canvasBox">
      <canvas id="drawCanvas"></canvas>
    </div>
  </div>

<script>
const CURRICULUM_DATA = {

    "Genel Yetenek": ["Sözel Mantık", "Sayısal Mantık", "Matematik", "Problemler", "Türkçe"],
    "Genel Kültür": ["Tarih", "Coğrafya", "Vatandaşlık", "Güncel Bilgiler"]
  },
  "ALES": {
    "Sayısal": ["Temel Matematik", "Cebir", "Sayısal Mantık", "Geometri"],
    "Sözel": ["Paragraf", "Sözel Mantık"]
  }
};

const DB_NAME = "SoruAvcisiDB";
const STORE_NAME = "questions";
let db;
let allQuestions = [];
let activeExamFilter = "";
let currentPracticeIndex = 0;

function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
  });
}

function dbPut(item) {
  return new Promise((resolve) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).put(item);
    tx.oncomplete = () => resolve();
  });
}

function dbGetAll() {
  return new Promise((resolve) => {
    const tx = db.transaction([STORE_NAME], "readonly");
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
  });
}

function dbDelete(id) {
  return new Promise((resolve) => {
    const tx = db.transaction([STORE_NAME], "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
  });
}

function compressImg(file) {
  return new Promise((resolve) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.readAsDataURL(file);
    r.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxW = 1000;
        let w = img.width, h = img.height;
        if (w > maxW) { h = (h * maxW) / w; w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
    };
  });
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  
  const activeTab = document.getElementById('tab-' + tabId);
  if (activeTab) activeTab.classList.add('active');
  if (btn) btn.classList.add('active');

  if (tabId === 'practice') setupPracticeMode();
  if (tabId === 'analytics') renderAnalytics();
}

function setExamFilter(exam) {
  activeExamFilter = exam;
  document.querySelectorAll('#examFilterPills .pill-chip').forEach(c => {
    c.classList.toggle('active', c.innerText === (exam || 'Tümü'));
  });
  renderFeed();
}

function renderFeed() {
  const container = document.getElementById("feedList");
  container.innerHTML = "";

  const filtered = activeExamFilter ? allQuestions.filter(q => q.exam === activeExamFilter) : allQuestions;

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-muted); font-size:0.85rem;">Henüz kayıtlı soru yok. Ortadaki '+' ile ilk yanlışını avla! 🎯</div>`;
    return;
  }

  filtered.forEach(q => {
    const card = document.createElement("div");
    card.className = "feed-card";
    card.innerHTML = `
      <div class="card-top">
        <span class="tag-exam">${q.exam} • ${q.subject}</span>
        <span class="tag-reason">${q.reason}</span>
      </div>
      <div class="card-image-wrap" onclick="openScratchpad('${q.questionImg}')">
        <img src="${q.questionImg}" alt="Soru">
      </div>
      <div class="card-body">
        <div class="topic-title">${q.topic}</div>
        ${q.notes ? `<div class="note-text">${q.notes}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn-action btn-solve" onclick="openScratchpad('${q.questionImg}')">✏️ Üstünde Çöz</button>
        ${q.solutionImg ? `<button class="btn-action" onclick="alertSolution('${q.id}')">💡 Çözüm</button>` : ''}
        <button class="btn-action" style="flex:0.3; color:var(--danger);" onclick="deleteItem('${q.id}')">🗑️</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function alertSolution(id) {
  const q = allQuestions.find(x => x.id === id);
  if (q && q.solutionImg) {
    openScratchpad(q.solutionImg);
  }
}

async function deleteItem(id) {
  if (confirm("Bu soruyu arşivden çıkarmak istiyor musun?")) {
    await dbDelete(id);
    await reloadData();
  }
}

/* Flaş Kart (Flipcard) Pratik Mantığı */
function setupPracticeMode() {
  if (allQuestions.length === 0) {
    document.getElementById("practiceContainer").innerHTML = `<div style="color:var(--text-muted); text-align:center;">Pratik yapacak soru bulunmuyor.</div>`;
    return;
  }
  currentPracticeIndex = 0;
  loadPracticeCard(currentPracticeIndex);
}

function loadPracticeCard(idx) {
  const q = allQuestions[idx];
  if (!q) {
    document.getElementById("practiceContainer").innerHTML = `<div style="text-align:center; padding:30px;"><h3 style="font-size:1.5rem; margin-bottom:10px;">Tebrikler! 🎉</h3><p style="color:var(--text-muted);">Tüm pratik sorularını tamamladın.</p></div>`;
    return;
  }
  const card = document.getElementById("practiceFlashcard");
  card.classList.remove("flipped");
  document.getElementById("pCardHeader").innerText = `${q.exam} - ${q.subject} (${idx + 1}/${allQuestions.length})`;
  document.getElementById("pCardFrontImg").src = q.questionImg;
  document.getElementById("pCardBackImg").src = q.solutionImg || q.questionImg;
  document.getElementById("pCardNote").innerText = q.notes ? "Not: " + q.notes : "Hata: " + q.reason;
}

function flipCard() {
  document.getElementById("practiceFlashcard").classList.toggle("flipped");
}

function nextPracticeCard(mastered) {
  currentPracticeIndex++;
  loadPracticeCard(currentPracticeIndex);
}

/* Rapor & Analiz */
function renderAnalytics() {
  document.getElementById("statTotalHero").innerText = allQuestions.length;
  document.getElementById("statMasteredHero").innerText = Math.round(allQuestions.length * 0.4);

  const reasonCounts = {}, subjectCounts = {};
  allQuestions.forEach(q => {
    reasonCounts[q.reason] = (reasonCounts[q.reason] || 0) + 1;
    subjectCounts[q.subject] = (subjectCounts[q.subject] || 0) + 1;
  });

  const maxR = Math.max(...Object.values(reasonCounts), 1);
  const rBox = document.getElementById("reportReasonBars");
  rBox.innerHTML = "";
  for (const [r, cnt] of Object.entries(reasonCounts)) {
    const pct = (cnt / maxR) * 100;
    rBox.innerHTML += `
      <div style="display:flex; align-items:center; gap:8px; font-size:0.75rem;">
        <span style="width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;">${r}</span>
        <div style="flex:1; background:rgba(255,255,255,0.05); height:8px; border-radius:4px; overflow:hidden;">
          <div style="width:${pct}%; background:var(--accent-purple); height:100%;"></div>
        </div>
        <span style="font-weight:700;">${cnt}</span>
      </div>
    `;
  }

  const maxS = Math.max(...Object.values(subjectCounts), 1);
  const sBox = document.getElementById("reportSubjectBars");
  sBox.innerHTML = "";
  for (const [s, cnt] of Object.entries(subjectCounts)) {
    const pct = (cnt / maxS) * 100;
    sBox.innerHTML += `
      <div style="display:flex; align-items:center; gap:8px; font-size:0.75rem;">
        <span style="width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;">${s}</span>
        <div style="flex:1; background:rgba(255,255,255,0.05); height:8px; border-radius:4px; overflow:hidden;">
          <div style="width:${pct}%; background:var(--accent-cyan); height:100%;"></div>
        </div>
        <span style="font-weight:700;">${cnt}</span>
      </div>
    `;
  }
}

/* Hızlı Form İşlemleri */
function onFastExamChange() {
  const exam = document.getElementById("fExam").value;
  const sub = document.getElementById("fSubject");
  sub.innerHTML = "";
  if (CURRICULUM_DATA[exam]) {
    Object.keys(CURRICULUM_DATA[exam]).forEach(s => {
      sub.innerHTML += `<option value="${s}">${s}</option>`;
    });
  }
  onFastSubjectChange();
}

function onFastSubjectChange() {
  const exam = document.getElementById("fExam").value;
  const sub = document.getElementById("fSubject").value;
  const top = document.getElementById("fTopicSelect");
  top.innerHTML = '<option value="">-- Konu Seç --</option>';
  if (CURRICULUM_DATA[exam] && CURRICULUM_DATA[exam][sub]) {
    CURRICULUM_DATA[exam][sub].forEach(t => {
      top.innerHTML += `<option value="${t}">${t}</option>`;
    });
  }
}

async function saveFastQuestion(e) {
  e.preventDefault();
  const qFile = document.getElementById("fQuestionImg").files[0];
  const sFile = document.getElementById("fSolutionImg").files[0];
  const topic = document.getElementById("fTopicCustom").value.trim();

  if (!qFile) return alert("Soru fotoğrafı zorunludur.");
  if (!topic) return alert("Konu adı belirtmelisin.");

  const item = {
    id: "q_" + Date.now(),
    exam: document.getElementById("fExam").value,
    subject: document.getElementById("fSubject").value,
    topic: topic,
    reason: document.getElementById("fReason").value,
    notes: document.getElementById("fNotes").value,
    questionImg: await compressImg(qFile),
    solutionImg: sFile ? await compressImg(sFile) : null,
    createdAt: new Date().toISOString()
  };

  await dbPut(item);
  document.getElementById("fastAddForm").reset();
  await reloadData();
  switchTab("feed", document.querySelector(".bottom-nav .nav-item"));
}

async function reloadData() {
  allQuestions = await dbGetAll();
  renderFeed();
}

/* Çizim Tuvali */
let canvasCtx, isDrawing = false, bgImg = null;
function initCanvas() {
  const canvas = document.getElementById("drawCanvas");
  canvasCtx = canvas.getContext("2d");
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  };
  const start = e => { isDrawing = true; const p = getPos(e); canvasCtx.beginPath(); canvasCtx.moveTo(p.x, p.y); };
  const draw = e => {
    if (!isDrawing) return;
    const p = getPos(e);
    canvasCtx.strokeStyle = document.getElementById("penColor").value;
    canvasCtx.lineWidth = 3;
    canvasCtx.lineCap = "round";
    canvasCtx.lineTo(p.x, p.y);
    canvasCtx.stroke();
  };
  const stop = () => isDrawing = false;
  canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", draw); window.addEventListener("mouseup", stop);
  canvas.addEventListener("touchstart", start, {passive:false}); canvas.addEventListener("touchmove", e => { e.preventDefault(); draw(e); }, {passive:false}); window.addEventListener("touchend", stop);
}

function openScratchpad(imgSrc) {
  document.getElementById("canvasModal").classList.add("active");
  const box = document.getElementById("canvasBox");
  const c = document.getElementById("drawCanvas");
  c.width = box.clientWidth; c.height = box.clientHeight;
  const im = new Image(); im.src = imgSrc;
  im.onload = () => {
    bgImg = im;
    const ratio = Math.min(c.width / im.width, c.height / im.height, 1);
    canvasCtx.drawImage(im, 0, 0, im.width, im.height, (c.width - im.width*ratio)/2, (c.height - im.height*ratio)/2, im.width*ratio, im.height*ratio);
  };
}
function clearCanvas() { if (bgImg) openScratchpad(bgImg.src); }
function closeBoard() { document.getElementById("canvasModal").classList.remove("active"); }

window.addEventListener("DOMContentLoaded", async () => {
  await initDB();
  initCanvas();
  onFastExamChange();
  await reloadData();
});
</script>
